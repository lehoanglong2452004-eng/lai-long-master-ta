<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lai Long Master TA</title>
  <meta name="description" content="Lai Long Master TA — hệ thống phân tích kỹ thuật: Wyckoff & VSA đa khung và giáo trình ôn luyện CMT tự biên soạn.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#analysis">
      <img src="assets/logo.svg" alt="" width="34" height="34">
      <span class="brand-text"><b>Lai Long</b><small>Master TA</small></span>
    </a>
    <nav id="nav" class="nav"></nav>
    <div class="top-actions">
      <button id="langBtn" class="btn ghost" title="Language">EN</button>
      <button id="themeBtn" class="btn ghost" title="Theme" aria-label="Theme">◐</button>
    </div>
  </header>

  <div id="controls" class="controls"></div>
  <div id="status" class="status" hidden></div>

  <main>
    <section id="view-analysis" class="view">
      <div class="grid-analysis">
        <div class="card chart-card">
          <div class="chart-head" id="chartHead"></div>
          <div id="chart" class="chart-wrap"></div>
          <div class="chart-toggles" id="toggles"></div>
        </div>
        <aside class="side">
          <div class="card" id="summary"></div>
          <div class="card" id="scenarios"></div>
        </aside>
      </div>
      <div class="card narrative" id="narrative"></div>
    </section>

    <section id="view-mtf" class="view">
      <div class="card"><div id="mtfTable"></div></div>
      <div class="card narrative" id="mtfStory"></div>
    </section>

    <section id="view-knowledge" class="view">
      <div class="kb">
        <nav class="card kb-toc" id="kbToc"></nav>
        <article class="card kb-body" id="kbBody"></article>
      </div>
    </section>

    <section id="view-cmt" class="view">
      <div class="kb">
        <nav class="card kb-toc cmt-toc" id="cmtToc"></nav>
        <article class="card kb-body cmt-body" id="cmtBody"></article>
      </div>
    </section>

    <section id="view-checklist" class="view">
      <div class="card" id="checklist"></div>
    </section>

    <section id="view-guide" class="view">
      <div class="card guide" id="guide"></div>
    </section>
  </main>

  <footer class="footer">
    <p id="disclaimer"></p>
    <p><span>© Lai Long Master TA</span> · <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener" id="chartCredit"></a></p>
  </footer>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/core.js?v=17"></script>
  <script src="js/indicators.js?v=17"></script>
  <script src="js/vsa.js?v=17"></script>
  <script src="js/wyckoff.js?v=17"></script>
  <script src="js/narrative.js?v=17"></script>
  <script src="js/data.js?v=17"></script>
  <script src="js/schematics.js?v=17"></script>
  <script src="js/knowledge.js?v=17"></script>
  <script src="js/chart.js?v=17"></script>
  <script src="js/cmt.js?v=17"></script>
  <script src="js/cmt-level1.js?v=17"></script>
  <script src="js/cmt-demos-p2.js?v=17"></script>
  <script src="js/cmt-l1-p2a.js?v=17"></script>
  <script src="js/cmt-l1-p2b.js?v=17"></script>
  <script src="js/cmt-l1-p3.js?v=17"></script>
  <script src="js/cmt-l1-p4a.js?v=17"></script>
  <script src="js/cmt-l1-p4b.js?v=17"></script>
  <script src="js/cmt-l1-p5.js?v=17"></script>
  <script src="js/cmt-l1-p67.js?v=17"></script>
  <script src="js/cmt-l1-extra.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
